# Comprueba cada pull request y publica la web en GitHub Pages en cada cambio de main.
name: Comprobar y publicar

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:        # botón «Run workflow» (p. ej., tras crear la etiqueta v1.0)

env:
  TZ: Europe/Madrid          # fechas de la web en hora española

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # historial y etiquetas completos para «Últimos cambios» y la versión
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias (dbt y DuckDB)
        run: pip install -r requirements.txt
      - name: Construir y probar el lakehouse (dbt build)
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Cifras del cuadro de mando (lee el oro)
        run: python bi/cuadro.py
      - name: Comprobar páginas, menú y que portal y BI cuadran
        run: python web/build.py --check
      - name: Construir la web
        run: python web/build.py
      - name: Documentación del lakehouse (dbt docs, con el linaje)
        if: github.event_name != 'pull_request'
        run: |
          dbt docs generate --static --project-dir dbt --profiles-dir dbt
          mkdir -p _site/dbt-docs
          cp dbt/target/static_index.html _site/dbt-docs/index.html
      - name: Guardar la web para publicarla
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Los dos pasos siguientes se ejecutan también cuando un test falla: dejan el lakehouse a la vista
      - name: Resumen del lakehouse
        if: always()
        run: python bi/resumen.py >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar el lakehouse de esta ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lakehouse-${{ github.event.pull_request.number || github.ref_name }}
          path: |
            lakehouse/plata/
            lakehouse/oro/
          if-no-files-found: warn

  publicar:
    if: github.event_name != 'pull_request'
    needs: comprobar
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
